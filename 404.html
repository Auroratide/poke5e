		<script>
			function setEdition() {
				const v = localStorage.getItem("rules-version")
				const beta = localStorage.getItem("feature-toggle::PreviewUpdatedMoves") != null
				const edition = (v === "2018" || v === "2024") ? v : "2024"

				document.documentElement.dataset.edition = beta ? edition : "2018"
			}

			function redirectToPreferredLanguage() {
				// for key, see LanguagePreference.ts
				const pref = localStorage.getItem("language-preference")
				if (!pref) return

				const baseLocale = "en"
				const prefixed = ["en","es","fr","de","pt"].filter((l) => l !== baseLocale)

				const path = location.pathname
				const seg = path.split("/")[1]
				const current = prefixed.includes(seg) ? seg : baseLocale
				if (current === pref) return

				const rest = current === baseLocale ? path : path.slice(seg.length + 1) || "/"
				location.replace((pref === baseLocale ? "" : "/" + pref) + rest + location.search + location.hash)
			}

			redirectToPreferredLanguage()
			setEdition()
		</script>
