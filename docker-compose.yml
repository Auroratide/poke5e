services:
  storage:
    build:
      context: storage
    container_name: storage-dev
    ports:
      - "9000:8333"
      - "9001:8888"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  storage_data:
    driver: local
